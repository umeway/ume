<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bikini Bottom availability — mark each day O (free) or X (busy).">
  <title>Bikini Bottom Availability</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="swimmers" aria-hidden="true"><span></span><span></span></div>
  <header class="site-header">
    <div class="wrap">
      <h1>Bikini Bottom Availability</h1>
      <p class="tagline">Tap a day: <strong>O</strong> = free, <strong>X</strong> = busy</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card cast" aria-label="Fish of the month">
      <div id="cast-art" class="cast-art" aria-hidden="true"></div>
      <div class="cast-text">
        <h2 id="cast-name" class="cast-name">Fish</h2>
        <p id="cast-line" class="cast-line" aria-live="polite"></p>
      </div>
    </section>

    <section class="card calendar" aria-labelledby="month-label">
      <div class="calendar-nav">
        <button type="button" class="icon-btn" id="prev-month" aria-label="Previous month">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 5l-7 7 7 7"></path>
          </svg>
        </button>
        <h2 id="month-label" class="month-label">Month</h2>
        <button type="button" class="icon-btn" id="next-month" aria-label="Next month">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>

      <div class="calendar-footer">
        <p id="month-summary" class="month-summary" aria-live="polite"></p>
        <button type="button" class="btn" id="today-btn">Today</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Everything is X until you say O.</p>
    </div>
  </footer>
</body>
</html>
